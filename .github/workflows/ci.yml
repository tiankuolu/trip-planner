name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (ruff + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest

      - name: 代码规范
        run: ruff check app tests

      - name: 单元测试
        env:
          # CI 没有真实 key：跳过启动时的强校验，测试全部走假服务，不联网
          SKIP_CONFIG_VALIDATION: "1"
          LOG_JSON: "1"
        run: python -m pytest -q

  frontend:
    name: frontend (vue-tsc + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 类型检查 + 构建
        run: npm run build

  containers:
    name: containers (compose 语法)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 只做语法/变量校验：CI 里不真起容器，避免拉镜像拖慢反馈
      - name: 校验 docker-compose.yml
        run: docker compose config --quiet
